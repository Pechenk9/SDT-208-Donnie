{% extends "ua/base.html" %}

{% block title %}Відкриваємо LiqPay — Donnie{% endblock %}

{% block site_footer %}{% endblock %}

{% block content %}
<form class="pay-screen" method="post" action="{{ checkout.url }}" id="liqpay-form" accept-charset="utf-8">
    <input type="hidden" name="data" value="{{ checkout.data }}">
    <input type="hidden" name="signature" value="{{ checkout.signature }}">
    <p class="state-message__title">Відкриваємо LiqPay…</p>
    <p>Якщо нічого не відбувається, натисніть кнопку.</p>
    <button type="submit" class="btn btn--block">Перейти до LiqPay</button>
</form>
<script>document.getElementById('liqpay-form').submit();</script>
{% endblock %}
